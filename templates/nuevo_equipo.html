<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Equipo</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f7f9; color: #333; margin: 0; padding: 30px; }
        .container { max-width: 600px; margin: 40px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #1e3c72; border-bottom: 3px solid #2a5298; padding-bottom: 10px; margin-top: 0; font-size: 24px; }
        label { display: block; margin-top: 20px; margin-bottom: 8px; font-weight: bold; color: #4a5568; }
        input[type="text"], select {
            width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;
            background-color: #fff; font-size: 15px; color: #333; box-sizing: border-box; font-family: inherit;
        }
        input:focus, select:focus { outline: none; border-color: #2a5298; box-shadow: 0 0 0 3px rgba(42, 82, 152, 0.15); }
        .form-actions { margin-top: 30px; }
        .btn { display: inline-block; background-color: #2a5298; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 15px; border: none; cursor: pointer; }
        .btn:hover { background-color: #1e3c72; }
        .btn-link { display: inline-block; margin-left: 15px; color: #64748b; text-decoration: none; font-size: 15px; }
        .btn-link:hover { text-decoration: underline; color: #334155; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Registrar Nueva PC / Equipo</h1>
        
        <form action="/nuevo_equipo" method="POST">
            <label for="codigo">Código Identificador (Etiqueta de la PC):</label>
            <input type="text" name="codigo" id="codigo" placeholder="Ej: PX-01 o AX-05" required>

            <label for="tipo">Tipo de Equipo:</label>
            <input type="text" name="tipo" id="tipo" placeholder="Ej: Notebook Lenovo, Desktop Exo, etc." required>

            <label for="ubicacion">Laboratorio / Ubicación habitual:</label>
            <select name="ubicacion" id="ubicacion">
                <option value="Lab Informática (PX)">Lab Informática (PX)</option>
                <option value="Lab Robótica (AX)">Lab Robótica (AX)</option>
                <option value="Arriba">Arriba</option>
            </select>

            <div class="form-actions">
                <button type="submit" class="btn">Guardar Equipo</button>
                <a href="/" class="btn-link">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>
