<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Préstamo</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f7f9; color: #333; margin: 0; padding: 30px; }
        .container { max-width: 600px; margin: 40px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #1e3c72; border-bottom: 3px solid #2a5298; padding-bottom: 10px; margin-top: 0; font-size: 24px; }
        label { display: block; margin-top: 20px; margin-bottom: 8px; font-weight: bold; color: #4a5568; }
        select, input[type="text"], input[type="date"] {
            width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;
            background-color: #fff; font-size: 15px; color: #333; box-sizing: border-box;
        }
        select[multiple] { height: 140px; padding: 5px; }
        select:focus, input:focus { outline: none; border-color: #2a5298; box-shadow: 0 0 0 3px rgba(42, 82, 152, 0.15); }
        .hint { font-size: 12px; color: #64748b; margin-top: 4px; display: block; }
        .form-actions { margin-top: 30px; }
        .btn { display: inline-block; background-color: #2a5298; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 15px; border: none; cursor: pointer; }
        .btn:hover { background-color: #1e3c72; }
        .btn-link { display: inline-block; margin-left: 15px; color: #64748b; text-decoration: none; font-size: 15px; }
        .btn-link:hover { text-decoration: underline; color: #334155; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Registrar Préstamo</h1>
        
        <form action="/nuevo_prestamo" method="POST">
            <label for="nombre_solicitante">Nombre y Apellido:</label>
            <input type="text" name="nombre_solicitante" id="nombre_solicitante" placeholder="Ej: Juanita del Valle" required>

            <label for="rol">Rol / Ocupación:</label>
            <select name="rol" id="rol" required>
                <option value="Alumno/a">Alumno/a</option>
                <option value="Profesor/a">Profesor/a</option>
            </select>

            <label for="componentes">Componentes a Retirar (Opcional):</label>
            <select name="componentes" id="componentes" multiple>
                {% for comp in componentes %}
                    <option value="{{ comp.id_componente }}">{{ comp.nombre }} (Stock: {{ comp.stock }})</option>
                {% endfor %}
            </select>
            <span class="hint">💡 Mantené presionada la tecla <strong>Ctrl</strong> (o <strong>Cmd</strong> en Mac) para seleccionar más de uno.</span>
            
            <label for="id_equipo">Computadora / Equipo Específico (Opcional):</label>
            <select name="id_equipo" id="id_equipo">
                <option value="">-- Ninguna --</option>
                {% for eq in equipos %}
                    <option value="{{ eq.id_equipo }}">{{ eq.codigo_identificador }} ({{ eq.ubicacion }})</option>
                {% endfor %}
            </select>

            <label for="fecha_retiro">Fecha de Retiro:</label>
            <input type="date" name="fecha_retiro" id="fecha_retiro" required>

            <label for="fecha_finalizacion">Fecha de Finalización:</label>
            <input type="date" name="fecha_finalizacion" id="fecha_finalizacion" required>

            <div class="form-actions">
                <button type="submit" class="btn">Guardar Préstamo</button>
                <a href="/" class="btn-link">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>
