<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Componente</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f7f9; color: #333; margin: 0; padding: 30px; }
        .container { max-width: 600px; margin: 40px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #ff7987; border-bottom: 3px solid #ff7987; padding-bottom: 10px; margin-top: 0; font-size: 24px; }
        label { display: block; margin-top: 20px; margin-bottom: 8px; font-weight: bold; color: #ff7987; }
        input[type="text"], input[type="number"], textarea {
            width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;
            background-color: #fff; font-size: 15px; color: #333; box-sizing: border-box; font-family: inherit;
        }
        input:focus, textarea:focus { outline: none; border-color: #ff8da1; box-shadow: 0 0 0 3px rgba(253, 148, 165, 0.377); }
        .hint { font-size: 12px; color: #64748b; margin-top: 4px; display: block; }
        .form-actions { margin-top: 30px; }
        .btn { display: inline-block; background-color: #ff8da1; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 15px; border: none; cursor: pointer; }
        .btn:hover { background-color: #ff7987; }
        .btn-link { display: inline-block; margin-left: 15px; color: #64748b; text-decoration: none; font-size: 15px; }
        .btn-link:hover { text-decoration: underline; color: #334155; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Registrar Nuevo Componente</h1>
        
        <form action="/nuevo_componente" method="POST">
            <label for="nombre">Nombre del Componente / Kit:</label>
            <input type="text" name="nombre" id="nombre" placeholder="Ej: Kit Impresora 3D Ender" required>

            <label for="numero_serie">Número de Serie (Opcional):</label>
            <input type="text" name="numero_serie" id="numero_serie" placeholder="Ej: SN-9876543210">
            <span class="hint">Si no tiene número de serie, podés dejar este campo en blanco.</span>

            <label for="descripcion">Descripción:</label>
            <textarea name="descripcion" id="descripcion" rows="3" placeholder="Ej: Incluye extrusor de repuesto, herramientas y filamento PLA"></textarea>

            <label for="stock">Cantidad / Stock Inicial:</label>
            <input type="number" name="stock" id="stock" min="1" value="1" required>

            <div class="form-actions">
                <button type="submit" class="btn">Guardar Componente</button>
                <a href="/" class="btn-link">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>
